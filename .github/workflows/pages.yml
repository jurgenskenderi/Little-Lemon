name: Publish the web app

# Mirrors docs/ onto the gh-pages branch, which GitHub Pages serves.
#
# Not `actions/deploy-pages`: that path needs the Pages site to already exist,
# and creating one from a workflow fails with "Resource not accessible by
# integration" because GITHUB_TOKEN has no admin rights. Pushing a branch only
# needs contents:write, so this works on a fresh repository with nothing
# configured by hand beyond pointing Pages at the branch once.
on:
  push:
    branches: [claude/geolocation-happy-hour-app-aktnqe, main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mirror docs/ onto gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/site"
          cp -r docs "$site"
          # Without this, Pages runs the content through Jekyll, which drops
          # anything whose name starts with an underscore.
          touch "$site/.nojekyll"

          cd "$site"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA:0:7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Where it lands
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          name="${GITHUB_REPOSITORY##*/}"
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${owner}.github.io/${name}/" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "If that 404s, set Settings → Pages → Source to **Deploy from a branch**, \
          branch \`gh-pages\`, folder \`/ (root)\`. One time only." >> "$GITHUB_STEP_SUMMARY"
